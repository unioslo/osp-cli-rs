name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v1.5.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.release_tag.outputs.value }}
      sha: ${{ steps.release_source.outputs.sha }}

    steps:
      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${REQUESTED_TAG}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi
          [[ "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid release tag" >&2
            exit 1
          }
          echo "value=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Validate requested tag exists
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.value }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.sha }}

      - name: Record immutable release source and coverage base
        id: release_source
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            coverage_base="$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD^ 2>/dev/null || git rev-parse HEAD^)"
            echo "COVERAGE_BASE=$(git rev-parse "${coverage_base}^{commit}")" >> "${GITHUB_ENV}"
          else
            echo "COVERAGE_BASE=empty" >> "${GITHUB_ENV}"
          fi

      - name: Validate tag matches package version
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.value }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          release_tag = os.environ["RELEASE_TAG"]
          if not release_tag.startswith("v"):
              raise SystemExit(f"release tag must start with 'v': {release_tag}")

          package = tomllib.loads(Path("Cargo.toml").read_text())
          version = package["package"]["version"]
          expected = f"v{version}"
          if release_tag != expected:
              raise SystemExit(
                  f"release tag {release_tag!r} does not match package version {expected!r}"
              )
          PY

      - name: Validate release notes
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.value }}
        run: python3 ./scripts/release.py check "${RELEASE_TAG}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Install native Linux linker and contract services
        run: |
          sudo apt-get update
          sudo apt-get install --yes lld dbus-daemon gnome-keyring libglib2.0-bin
          ld.lld --version

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install pinned confidence tools
        run: python3 ./scripts/confidence.py --install-tools full

      - name: Run full confidence lane
        run: python3 ./scripts/confidence.py full

      - name: Dry-run publish
        run: python3 ./scripts/confidence.py --check publish-dry-run

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io-release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Install native Linux linker
        run: |
          sudo apt-get update
          sudo apt-get install --yes lld
          ld.lld --version

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Confirm release tag still identifies verified source
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
        shell: bash
        run: |
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}"
          [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" == "${RELEASE_SHA}" ]] || {
            echo "Release tag moved after verification" >&2
            exit 1
          }

      - name: Check crates.io publish state and source identity
        id: crates_io_state
        env:
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
        shell: bash
        run: |
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import io
          import json
          import os
          import tarfile
          import tomllib
          import urllib.error
          import urllib.request
          from pathlib import Path

          package = tomllib.loads(Path("Cargo.toml").read_text())["package"]
          name = package["name"]
          version = package["version"]
          url = f"https://crates.io/api/v1/crates/{name}/{version}"
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  published = response.status == 200
          except urllib.error.HTTPError as err:
              if err.code == 404:
                  published = False
              else:
                  raise

          if published:
              archive_url = f"https://crates.io/api/v1/crates/{name}/{version}/download"
              with urllib.request.urlopen(archive_url, timeout=30) as response:
                  archive_bytes = response.read()
              with tarfile.open(fileobj=io.BytesIO(archive_bytes), mode="r:gz") as archive:
                  try:
                      vcs_file = archive.extractfile(f"{name}-{version}/.cargo_vcs_info.json")
                  except KeyError:
                      raise SystemExit("Published crate has no source identity metadata")
                  if vcs_file is None:
                      raise SystemExit("Published crate source identity is not a file")
                  vcs = json.load(vcs_file)
              if (
                  vcs["git"]["sha1"] != os.environ["RELEASE_SHA"]
                  or vcs["git"].get("dirty", False)
                  or vcs.get("path_in_vcs") != ""
              ):
                  raise SystemExit("Published crate does not match the clean verified source")

          print(f"name={name}")
          print(f"version={version}")
          print(f"published={'true' if published else 'false'}")
          PY

      - name: Authenticate with crates.io
        if: steps.crates_io_state.outputs.published != 'true'
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate to crates.io
        if: steps.crates_io_state.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        run: cargo publish --locked

      - name: Skip crates.io publish because version already exists
        if: steps.crates_io_state.outputs.published == 'true'
        run: |
          echo "${{ steps.crates_io_state.outputs.name }} ${{ steps.crates_io_state.outputs.version }} is already published on crates.io; skipping publish."

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          body_path: docs/releases/${{ needs.verify.outputs.tag }}.md
          target_commitish: ${{ needs.verify.outputs.sha }}
